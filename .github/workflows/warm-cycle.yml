name: Warm Turso district DBs (cycle)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: warm-cycle
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - run: node scripts/warm_cycle_turso.cjs
        env:
          TURSO_TOKEN_C: ${{ secrets.TURSO_TOKEN_C }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}

          TURSO_USER: ${{ secrets.TURSO_USER }}
          TURSO_URL_SUFFIX: ${{ secrets.TURSO_URL_SUFFIX }}
          TURSO_DB_PREFIX: ${{ secrets.TURSO_DB_PREFIX }}

          WARM_STATE: S27
          WARM_BATCH: "6"
          WARM_CONCURRENCY: "3"
          WARM_INTERVAL_MIN: "10"
          WARM_ACS_PER_DISTRICT: "0"
